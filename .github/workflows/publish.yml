name: Publish

# Push a tag that matches package.json, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
# Versions with a pre-release part (1.1.0-beta.1) go to the `next` dist-tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "DIST_TAG=next" >> "$GITHUB_ENV" ;;
            *) echo "DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - run: npm ci
      # trusted publishing: npm exchanges the OIDC token, no npm token needed
      - run: npm publish --provenance --access public --tag "$DIST_TAG"
      # The official MCP Registry (registry.modelcontextprotocol.io) lists the
      # server from server.json; GitHub OIDC proves the io.github.vvapnik/
      # namespace. Only for stable versions from 1.0.0 on: no catalog listings
      # before 1.0.0 (TASK-78 on the Lab board). A failure does not undo npm.
      - name: Publish to the MCP Registry
        if: env.DIST_TAG == 'latest' && !startsWith(github.ref_name, 'v0.')
        continue-on-error: true
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
